<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <title>SelfNote AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat is-empty">
    <div id="intro">
        <div class="logo-wrapper">
            <img src="main_logo.png" alt="Logo" class="main-logo">
            <h1>SelfNote</h1>
        </div>
    </div>

    <div id="chat"></div>

    <div class="animated-border-wrapper">
        <div class="input">
            <textarea id="message" placeholder="Спросите SelfNote" autocomplete="off" rows="1"></textarea>
            <button id="send">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
